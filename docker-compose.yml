services:
  # ─────────────────────────────
  # Database chính: Postgres + PostGIS + TimescaleDB
  # ─────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: aqi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqi-network

  # ─────────────────────────────
  # Redis: cache + Asynq queue
  # ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aqi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqi-network

  # ─────────────────────────────
  # Keycloak: DB & Service
  # ─────────────────────────────
  keycloak-db:
    image: postgres:16
    container_name: aqi-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - aqi-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aqi-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}?sslmode=disable
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - aqi-network

  # ─────────────────────────────
  # Backend: API server (đồng bộ)
  # ─────────────────────────────
  # backend-api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #     target: api
  #   container_name: aqi-backend-api
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: postgres
  #     REDIS_HOST: redis
  #     KEYCLOAK_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     keycloak:
  #       condition: service_started
  #   networks:
  #     - aqi-network

  # ─────────────────────────────
  # Backend: Worker
  # ─────────────────────────────
  # backend-worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #     target: worker
  #   container_name: aqi-backend-worker
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: postgres
  #     REDIS_HOST: redis
  #     WAQI_API_TOKEN: ${WAQI_API_TOKEN}
  #     RESEND_API_KEY: ${RESEND_API_KEY}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - aqi-network

  # ─────────────────────────────
  # Frontend: Next.js
  # ─────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: aqi-frontend
  #   restart: unless-stopped
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   ports:
  #     - "3000:3000"
